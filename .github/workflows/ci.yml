name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    env:
      # Diese Werte sind public-safe (per Next.js-Konvention NEXT_PUBLIC_*) und landen ohnehin im Browser-Bundle.
      NEXT_PUBLIC_SUPABASE_URL: https://cjwgisdobzztljizrnfn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-R7Ah6qj3dYqSm6Td_7BWg_tlzE4NB3
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
